<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural do Grupo</title>
<style>
  :root{
    --ink:#12181c;
    --panel:#1b2329;
    --panel-2:#232d34;
    --paper:#f3ede0;
    --amber:#e0a03a;
    --amber-dim:#8a6423;
    --red:#c1442c;
    --line:#33414a;
    --text:#f3ede0;
    --text-dim:#9fb0b8;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Georgia', 'Times New Roman', serif;
    min-height:100vh;
  }
  .utility{ font-family: 'Courier New', monospace; letter-spacing:0.08em; text-transform:uppercase; }

  /* ---------- TOP BAR ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand .mark{
    width:10px;height:10px;background:var(--amber);
    display:inline-block;
    transform: rotate(45deg);
  }
  .brand h1{
    font-size:22px; font-weight:400; letter-spacing:0.02em;
  }
  .brand .tag{
    font-size:11px; color:var(--text-dim);
  }
  #userbar{ display:flex; align-items:center; gap:16px; font-size:13px; }
  #userbar span{ color:var(--text-dim); }
  button{
    font-family:inherit; cursor:pointer; border:1px solid var(--amber-dim);
    background:transparent; color:var(--amber); padding:9px 18px;
    border-radius:var(--radius); font-size:13px; letter-spacing:0.03em;
    transition: all .15s ease;
  }
  button:hover{ background:var(--amber); color:var(--ink); border-color:var(--amber); }
  button.primary{ background:var(--amber); color:var(--ink); }
  button.primary:hover{ background:#f0b658; }
  button.ghost{ border-color:var(--line); color:var(--text-dim); }
  button.ghost:hover{ background:var(--panel-2); color:var(--text); border-color:var(--line);}
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- AUTH SCREEN ---------- */
  #auth-screen{
    max-width:380px; margin:80px auto; padding:36px;
    background:var(--panel); border:1px solid var(--line);
    position:relative;
  }
  #auth-screen::before{
    content:''; position:absolute; top:-1px; left:-1px; right:-1px; height:3px;
    background:linear-gradient(90deg, var(--amber), var(--red));
  }
  #auth-screen h2{ font-weight:400; font-size:20px; margin-bottom:6px; }
  #auth-screen p.sub{ color:var(--text-dim); font-size:13px; margin-bottom:24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.08em; font-family:'Courier New', monospace;}
  .field input{
    width:100%; padding:11px 12px; background:var(--ink); border:1px solid var(--line);
    color:var(--text); font-family:inherit; font-size:14px; border-radius:var(--radius);
  }
  .field input:focus{ outline:none; border-color:var(--amber); }
  #auth-screen button.primary{ width:100%; padding:12px; margin-top:6px; font-size:14px;}
  .switch-mode{ text-align:center; margin-top:18px; font-size:13px; color:var(--text-dim); }
  .switch-mode a{ color:var(--amber); cursor:pointer; text-decoration:none; }
  #auth-msg{ font-size:13px; margin-top:14px; padding:10px; border-radius:var(--radius); display:none; }
  #auth-msg.show{ display:block; }
  #auth-msg.error{ background:rgba(193,68,44,0.15); color:#e8917d; border:1px solid var(--red); }
  #auth-msg.info{ background:rgba(224,160,58,0.12); color:var(--amber); border:1px solid var(--amber-dim); }

  /* ---------- GALLERY SCREEN ---------- */
  #gallery-screen{ display:none; padding:32px; max-width:1200px; margin:0 auto; }
  .gallery-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;}
  .gallery-head h2{ font-weight:400; font-size:26px; }
  .gallery-head .count{ font-family:'Courier New',monospace; font-size:12px; color:var(--text-dim); margin-top:4px;}

  #upload-box{
    border:1px dashed var(--line); padding:18px; margin-bottom:32px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  #upload-box input[type=file]{ color:var(--text-dim); font-size:13px; }
  #upload-progress{ font-size:12px; color:var(--amber); font-family:'Courier New',monospace; display:none;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:22px;
  }
  .photo-card{
    background:var(--paper); padding:10px 10px 12px 10px; position:relative;
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
    transform: rotate(var(--r,0deg));
    transition: transform .2s ease;
  }
  .photo-card:nth-child(3n){ --r:-1.2deg; }
  .photo-card:nth-child(3n+1){ --r:0.8deg; }
  .photo-card:nth-child(3n+2){ --r:-0.4deg; }
  .photo-card:hover{ transform: rotate(0deg) scale(1.02); z-index:2; }
  .photo-card img{ width:100%; height:200px; object-fit:cover; display:block; background:#333;}
  .photo-card .caption{
    margin-top:8px;
    color:#1a1a1a; font-size:12px; display:flex; justify-content:space-between;
    font-family:'Courier New', monospace;
  }
  .photo-card .caption .who{ font-weight:bold; }

  .comments-box{
    margin-top:10px; padding-top:8px; border-top:1px dashed rgba(0,0,0,0.25);
  }
  .comments-list{ max-height:80px; overflow-y:auto; margin-bottom:6px; }
  .comment-item{
    font-family:'Courier New', monospace; font-size:11px; color:#3a3428;
    margin-bottom:4px; line-height:1.4;
  }
  .comment-item .c-who{ font-weight:bold; color:#1a1a1a; }
  .comment-form{ display:flex; gap:6px; margin-top:6px; }
  .comment-form input{
    flex:1; font-family:inherit; font-size:11px; padding:6px 8px;
    border:1px solid rgba(0,0,0,0.25); border-radius:var(--radius);
    background:rgba(255,255,255,0.5); color:#1a1a1a;
  }
  .comment-form button{
    padding:6px 10px; font-size:11px; border-color:var(--amber-dim); color:var(--amber-dim);
    background:transparent;
  }
  .comment-form button:hover{ background:var(--amber-dim); color:var(--paper); }
  .comments-box{ margin-top:8px; background:#e6dfcd; padding:8px; border-top:1px dashed #b8ac8f; }
  .comments-list{ max-height:110px; overflow-y:auto; margin-bottom:6px; }
  .comment-item{ font-size:11px; color:#3a332a; margin-bottom:4px; line-height:1.35; }
  .comment-item .c-who{ font-weight:bold; font-family:'Courier New', monospace; }
  .comment-form{ display:flex; gap:6px; }
  .comment-form input{
    flex:1; padding:6px 8px; font-size:11px; border:1px solid #b8ac8f;
    background:#fffdf5; color:#1a1a1a; border-radius:2px; font-family:inherit;
  }
  .comment-form button{
    padding:6px 10px; font-size:11px; border:1px solid var(--amber-dim);
    background:var(--amber); color:var(--ink);
  }
  .empty-state{ text-align:center; padding:80px 20px; color:var(--text-dim); }
  .empty-state .mark-big{ font-size:32px; margin-bottom:12px; }

  #chat-box{
    background:var(--panel); border:1px solid var(--line);
    display:flex; flex-direction:column; height:60vh; max-height:520px;
  }
  #chat-messages{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .chat-msg{
    max-width:75%; padding:8px 12px; border-radius:var(--radius);
    background:var(--panel-2); font-size:13px; line-height:1.4;
    align-self:flex-start;
  }
  .chat-msg.mine{ align-self:flex-end; background:var(--amber-dim); color:var(--ink); }
  .chat-msg .who{
    display:block; font-family:'Courier New', monospace; font-size:10px;
    color:var(--text-dim); margin-bottom:3px; letter-spacing:0.05em;
  }
  .chat-msg.mine .who{ color:rgba(18,24,28,0.6); }
  #chat-input-row{
    display:flex; gap:10px; padding:14px; border-top:1px solid var(--line);
  }
  #chat-input-row input{
    flex:1; padding:11px 12px; background:var(--ink); border:1px solid var(--line);
    color:var(--text); font-family:inherit; font-size:14px; border-radius:var(--radius);
  }
  #chat-input-row input:focus{ outline:none; border-color:var(--amber); }

  @media (max-width:600px){
    header{ padding:16px; flex-wrap:wrap; gap:12px;}
    #gallery-screen{ padding:18px; }
    #auth-screen{ margin:40px 16px; padding:24px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Mural do Grupo</h1>
      <div class="tag utility">galeria privada</div>
    </div>
  </div>
  <div id="userbar" style="display:none;">
    <button class="ghost" id="chat-toggle-btn">Chat do grupo</button>
    <span id="user-email"></span>
    <button class="ghost" id="logout-btn">Sair</button>
  </div>
</header>

<!-- ===== AUTH ===== -->
<div id="auth-screen">
  <h2 id="auth-title">Entrar</h2>
  <p class="sub" id="auth-sub">Acesse com sua conta para ver e publicar fotos.</p>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email-input" placeholder="voce@exemplo.com">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="password-input" placeholder="••••••••">
  </div>

  <button class="primary" id="auth-submit-btn">Entrar</button>

  <div id="auth-msg"></div>

  <div class="switch-mode">
    <span id="switch-text">Ainda não tem conta?</span> <a id="switch-link">Cadastre-se</a>
  </div>
</div>

<!-- ===== GALLERY ===== -->
<div id="gallery-screen">
  <div class="gallery-head">
    <div>
      <h2>Fotos do grupo</h2>
      <div class="count utility" id="photo-count">0 fotos</div>
    </div>
  </div>

  <div id="upload-box">
    <input type="file" id="file-input" accept="image/*">
    <button class="primary" id="upload-btn">Publicar foto</button>
    <span id="upload-progress" class="utility"></span>
  </div>

  <div class="grid" id="photo-grid"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="mark-big">✦</div>
    <p>Nenhuma foto ainda. Seja o primeiro a publicar.</p>
  </div>
</div>

<!-- ===== CHAT GERAL ===== -->
<div id="chat-screen" style="display:none;">
  <div class="gallery-head">
    <div>
      <h2>Chat do grupo</h2>
      <div class="count utility">conversa geral</div>
    </div>
    <button class="ghost" id="chat-back-btn">← Voltar às fotos</button>
  </div>

  <div id="chat-box">
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input type="text" id="chat-input" placeholder="Escrever uma mensagem...">
      <button class="primary" id="chat-send-btn">Enviar</button>
    </div>
  </div>
</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, doc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ Configuração do projeto Firebase (login + banco de dados).
  const firebaseConfig = {
    apiKey: "AIzaSyB02cc2v6UhrMtSXgksb0he93064dqAzTw",
    authDomain: "nossas-fotografias-velhos.firebaseapp.com",
    projectId: "nossas-fotografias-velhos",
    storageBucket: "nossas-fotografias-velhos.firebasestorage.app",
    messagingSenderId: "544346329101",
    appId: "1:544346329101:web:e6f24109b80587cde8c544"
  };

  // ⚠️ COLE AQUI os dados do SEU Cloudinary (Passo a seguir no guia).
  const CLOUDINARY_CLOUD_NAME = "qxbomamt";
  const CLOUDINARY_UPLOAD_PRESET = "mural_grupo";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ---------- ELEMENTOS ----------
  const authScreen = document.getElementById('auth-screen');
  const galleryScreen = document.getElementById('gallery-screen');
  const userbar = document.getElementById('userbar');
  const userEmailEl = document.getElementById('user-email');

  const emailInput = document.getElementById('email-input');
  const passwordInput = document.getElementById('password-input');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authMsg = document.getElementById('auth-msg');
  const authTitle = document.getElementById('auth-title');
  const authSub = document.getElementById('auth-sub');
  const switchText = document.getElementById('switch-text');
  const switchLink = document.getElementById('switch-link');
  const logoutBtn = document.getElementById('logout-btn');

  const fileInput = document.getElementById('file-input');
  const uploadBtn = document.getElementById('upload-btn');
  const uploadProgress = document.getElementById('upload-progress');
  const photoGrid = document.getElementById('photo-grid');
  const photoCount = document.getElementById('photo-count');
  const emptyState = document.getElementById('empty-state');

  const chatToggleBtn = document.getElementById('chat-toggle-btn');
  const chatBackBtn = document.getElementById('chat-back-btn');
  const chatScreen = document.getElementById('chat-screen');
  const chatMessages = document.getElementById('chat-messages');
  const chatInput = document.getElementById('chat-input');
  const chatSendBtn = document.getElementById('chat-send-btn');
  let chatListenerAtivo = false;

  let mode = 'login'; // ou 'signup'

  function showMsg(text, type){
    authMsg.textContent = text;
    authMsg.className = 'show ' + type;
  }
  function clearMsg(){
    authMsg.className = '';
    authMsg.textContent = '';
  }

  switchLink.addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    clearMsg();
    if(mode === 'signup'){
      authTitle.textContent = 'Criar conta';
      authSub.textContent = 'Cadastre-se para ver e publicar fotos do grupo.';
      authSubmitBtn.textContent = 'Cadastrar';
      switchText.textContent = 'Já tem conta?';
      switchLink.textContent = 'Entrar';
    } else {
      authTitle.textContent = 'Entrar';
      authSub.textContent = 'Acesse com sua conta para ver e publicar fotos.';
      authSubmitBtn.textContent = 'Entrar';
      switchText.textContent = 'Ainda não tem conta?';
      switchLink.textContent = 'Cadastre-se';
    }
  });

  authSubmitBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const pass = passwordInput.value;
    if(!email || !pass){ showMsg('Preencha e-mail e senha.', 'error'); return; }
    authSubmitBtn.disabled = true;
    try{
      if(mode === 'login'){
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        await createUserWithEmailAndPassword(auth, email, pass);
      }
    } catch(err){
      showMsg(traduzErro(err.code), 'error');
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  function traduzErro(code){
    const map = {
      'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
      'auth/invalid-email': 'E-mail inválido.',
      'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
    };
    return map[code] || ('Erro: ' + code);
  }

  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      authScreen.style.display = 'none';
      galleryScreen.style.display = 'block';
      userbar.style.display = 'flex';
      userEmailEl.textContent = user.email;
      escutarFotos();
    } else {
      authScreen.style.display = 'block';
      galleryScreen.style.display = 'none';
      userbar.style.display = 'none';
    }
  });

  // ---------- UPLOAD ----------
  uploadBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if(!file){ alert('Escolha uma foto primeiro.'); return; }
    const user = auth.currentUser;
    if(!user) return;

    uploadBtn.disabled = true;
    uploadProgress.style.display = 'inline';
    uploadProgress.textContent = 'enviando...';

    try{
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      const cloudinaryUrl = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
      const res = await fetch(cloudinaryUrl, { method: 'POST', body: formData });
      if(!res.ok) throw new Error('Falha no upload ao Cloudinary');
      const data = await res.json();
      const url = data.secure_url;

      await addDoc(collection(db, 'fotos'), {
        url,
        autor: user.email,
        criadoEm: serverTimestamp()
      });

      fileInput.value = '';
      uploadProgress.textContent = 'publicado ✓';
      setTimeout(() => { uploadProgress.style.display = 'none'; }, 1500);
    } catch(err){
      uploadProgress.textContent = 'erro ao enviar';
      console.error(err);
    } finally {
      uploadBtn.disabled = false;
    }
  });

  // ---------- GALERIA (tempo real) ----------
  const comentariosPorFoto = {}; // cache: { fotoId: [comentarios] }

  function escutarFotos(){
    const q = query(collection(db, 'fotos'), orderBy('criadoEm', 'desc'));
    onSnapshot(q, (snapshot) => {
      photoGrid.innerHTML = '';
      if(snapshot.empty){
        emptyState.style.display = 'block';
        photoCount.textContent = '0 fotos';
        return;
      }
      emptyState.style.display = 'none';
      photoCount.textContent = snapshot.size + (snapshot.size === 1 ? ' foto' : ' fotos');

      snapshot.forEach((doc) => {
        const fotoId = doc.id;
        const data = doc.data();
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${data.url}" loading="lazy" alt="Foto publicada por ${data.autor}">
          <div class="caption">
            <span class="who">${data.autor ? data.autor.split('@')[0] : 'anônimo'}</span>
          </div>
          <div class="comments-box">
            <div class="comments-list" id="comments-${fotoId}"></div>
            <div class="comment-form">
              <input type="text" id="comment-input-${fotoId}" placeholder="Escrever um comentário...">
              <button data-foto-id="${fotoId}" class="btn-comentar">Enviar</button>
            </div>
          </div>
        `;
        photoGrid.appendChild(card);
        escutarComentarios(fotoId);
      });

      // liga os botões de comentar (delegação simples após render)
      document.querySelectorAll('.btn-comentar').forEach((btn) => {
        btn.addEventListener('click', () => enviarComentario(btn.dataset.fotoId));
      });
    });
  }

  function escutarComentarios(fotoId){
    const q = query(collection(db, 'fotos', fotoId, 'comentarios'), orderBy('criadoEm', 'asc'));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById(`comments-${fotoId}`);
      if(!container) return; // card pode já ter sido re-renderizado
      container.innerHTML = '';
      snapshot.forEach((doc) => {
        const c = doc.data();
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<span class="c-who">${c.autor ? c.autor.split('@')[0] : 'anônimo'}:</span> ${escapeHtml(c.texto)}`;
        container.appendChild(item);
      });
      container.scrollTop = container.scrollHeight;
    });
  }

  async function enviarComentario(fotoId){
    const input = document.getElementById(`comment-input-${fotoId}`);
    const texto = input.value.trim();
    if(!texto) return;
    const user = auth.currentUser;
    if(!user) return;
    input.value = '';
    try{
      await addDoc(collection(db, 'fotos', fotoId, 'comentarios'), {
        texto,
        autor: user.email,
        criadoEm: serverTimestamp()
      });
    } catch(err){
      console.error('Erro ao comentar:', err);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- CHAT GERAL ----------
  chatToggleBtn.addEventListener('click', () => {
    document.getElementById('gallery-screen').style.display = 'none';
    chatScreen.style.display = 'block';
    if(!chatListenerAtivo){
      escutarChat();
      chatListenerAtivo = true;
    }
  });

  chatBackBtn.addEventListener('click', () => {
    chatScreen.style.display = 'none';
    document.getElementById('gallery-screen').style.display = 'block';
  });

  chatSendBtn.addEventListener('click', enviarMensagemChat);
  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') enviarMensagemChat();
  });

  async function enviarMensagemChat(){
    const texto = chatInput.value.trim();
    if(!texto) return;
    const user = auth.currentUser;
    if(!user) return;
    chatInput.value = '';
    try{
      await addDoc(collection(db, 'chat'), {
        texto,
        autor: user.email,
        criadoEm: serverTimestamp()
      });
    } catch(err){
      console.error('Erro ao enviar mensagem:', err);
    }
  }

  function escutarChat(){
    const q = query(collection(db, 'chat'), orderBy('criadoEm', 'asc'));
    onSnapshot(q, (snapshot) => {
      chatMessages.innerHTML = '';
      const user = auth.currentUser;
      snapshot.forEach((doc) => {
        const m = doc.data();
        const isMine = user && m.autor === user.email;
        const item = document.createElement('div');
        item.className = 'chat-msg' + (isMine ? ' mine' : '');
        item.innerHTML = `
          <span class="who">${m.autor ? m.autor.split('@')[0] : 'anônimo'}</span>
          ${escapeHtml(m.texto)}
        `;
        chatMessages.appendChild(item);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });
  }
</script>
</body>
</html>
